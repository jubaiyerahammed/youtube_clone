<div class="short-card">
    
    <div class="short-thumb">
        <img src="{{ s.thumbnail }}" alt="{{ s.title }}">
        <span class="duration">{{ s.duration }}</span>
    </div>

    <div class="short-title">{{ s.title }}</div>
    <div class="short-views">{{ s.views }} views • {{ s.channel_name }}</div>

</div>

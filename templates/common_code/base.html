
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>YouTube Clone</title>

{% block title %}
{% endblock %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Left Sidebar */
        .sidebar {
            width: 10%;
            background: linear-gradient(180deg, #cecaca, #cfccca, #91908e);
            color: rgb(29, 4, 4);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .sidebar h2 {
            font-size: 20px;
        }

        .menu-item {
            width: 90%;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.03);
        }

        /* Main Section */
        .main {
            width: 90%;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .topbar {
            height: 8%;
            background: linear-gradient(90deg, #58535e, #44484f);
            color: white;
            display: flex;
            align-items:center ;
            
            padding: 0 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .left, .center, .right {
            flex: 1;

        }
        .left h1 {
            font-size: 24px;
            margin: 0;
            
        }
        .center{
            display: flex;
            justify-content: center;
        }
        .search-box{
            position: relative;
        }
        .search-box i{
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 16px;
            cursor: pointer;

            background: white;
            padding: 10px 15px;
            border-radius: 25%;
            width: 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .search-box input {
            padding: 10px 15px;
            border: none;
            border-radius: 25px;
            width: 400px;
            outline: none;
        }
        /* Voice Button */
        .vioce-btn{
            
        
            margin-left: 10px;
            padding: 10px 15px;
            border: none;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .voice-btn i {
            font-size: 18px;
            color: #333;
        }
            
        
        /* Right section icons layout */
        .right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
        }
        /* Create Button */
        .create-btn {
            background: white;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .create-btn i {
            font-size: 16px;
        }

        /* Notification Bell */
        .notif-icon {
            font-size: 22px;
            cursor: pointer;
            color: white;
        }

        /* Profile Icon */
        .profile-icon {
            font-size: 28px;
            cursor: pointer;
            color: white;
        }
        /* Content Area */
        .content {
            height: 92%;
            background: white;
            padding: 20px;
            overflow-y: auto;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 20%;
            }

            .main {
                width: 80%;
            }

            .search-box input {
                width: 150px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Left Sidebar -->
    <div class="sidebar">
        <h2>YOUTUBE</h2>

        <div class="menu-item">Home</div>
        <div class="menu-item">Videos</div>
        <div class="menu-item">Shorts</div>
        <div class="menu-item">Live</div>
        <div class="menu-item">Library</div>
    </div>

    <!-- Main Area -->
    <div class="main">

        <!-- Top Bar -->
        <div class="topbar">
            <div class="left">
                <h1>Youtube Clone</h1>
            </div>

            <div class="center">
                <div class="search-box">
                    <i class="fa fa-search"></i>
                    <input type="text" placeholder="Search videos...">
                </div>
                <div>
                    <button class="vioce-btn">
                        <i class="fa fa-microphone"></i>
                    </button>
                </div>

            </div>
            <div class="right">
                <button class="create-btn">
                    <i class="fa fa-plus"></i> Create
                </button>

                <i class="fa fa-bell notif-icon"></i>

                <i class="fa fa-user-circle profile-icon"></i>

            </div>
        </div>

        <!-- Content Area -->
        <div class="content">
            {% block content %}

            Your page content will come here

            {% endblock %} 
        </div>

    </div>

</div>

</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet"
          href="{% static 'css/common/base.css' %}">

    <!-- Profile CSS -->
    <link rel="stylesheet"
          href="{% static 'css/common/profile.css' %}">

    <title>YouTube Clone</title>


    {% block extra_css %}
    {% endblock %}

</head>

<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">


    <!-- LEFT SIDE -->
    <div class="topbar-left">

        <!-- Hamburger -->
        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-label="Toggle sidebar"
        >
            <i class="fa-solid fa-bars"></i>
        </button>


        <!-- YouTube Logo -->
        <div class="youtube-logo">
            <span>YOUTUBE</span>
        </div>

    </div>



    <!-- SEARCH -->
    <div class="topbar-center">

        <div class="search-box">

            <input
                type="text"
                placeholder="Search videos..."
            >

            <button
                type="button"
                class="search-btn"
            >
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>


        <button
            type="button"
            class="voice-btn"
            title="Voice Search"
        >
            <i class="fa-solid fa-microphone"></i>
        </button>

    </div>



    <!-- RIGHT SIDE -->
    <div class="topbar-right">


        <button
            type="button"
            class="create-btn"
        >
            <i class="fa-solid fa-plus"></i>
            <span>Create</span>
        </button>


        <button
            type="button"
            class="icon-btn"
        >
            <i class="fa-solid fa-bell"></i>
        </button>


        <!-- PROFILE -->

        <div class="profile-wrapper">

            <button
                type="button"
                class="profile-button"
                id="profileButton"
                aria-label="Open profile menu"
                aria-expanded="false"
            >

                <i class="fa-solid fa-user-circle profile-icon"></i>

            </button>


            <div
                class="profile-menu"
                id="profileMenu"
                aria-hidden="true"
            >

                {% include "components/profile_menu.html" %}

            </div>

        </div>


    </div>

</header>



<!-- =====================================================
     BELOW TOPBAR
===================================================== -->

<div class="page-layout">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <nav class="sidebar-menu">


            <div class="menu-item active">

                <i class="fa-solid fa-house"></i>

                <span>Home</span>

            </div>


            <div class="menu-item">

                <i class="fa-solid fa-video"></i>

                <span>Videos</span>

            </div>


            <div class="menu-item">

                <i class="fa-brands fa-youtube"></i>

                <span>Shorts</span>

            </div>


            <div class="menu-item">

                <i class="fa-solid fa-tower-broadcast"></i>

                <span>Live</span>

            </div>


            <div class="menu-item">

                <i class="fa-solid fa-book"></i>

                <span>Library</span>

            </div>


        </nav>

    </aside>



    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main">

        <div class="content">

            {% block content %}

                Your page content will come here

            {% endblock %}

        </div>

    </main>


</div>



<!-- Profile JS -->

<script src="{% static 'js/common/profile.js' %}"></script>


<!-- Sidebar JS -->

<script src="{% static 'js/common/sidebar.js' %}"></script>


</body>

</html>
